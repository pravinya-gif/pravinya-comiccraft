<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Comic Export — ComicCraft</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main class="shell success-shell"><section class="card success-card">
  <div class="success-icon">✓</div><div class="eyebrow">EXPORT READY</div><h1>Your comic is ready to keep.</h1>

  <a class="primary button-link" href="/download/{{ comic.comic_id }}">Download PDF <span>↓</span></a>
  <a class="ghost" href="/">Go create another comic</a>
</section></main></body>
</html>
